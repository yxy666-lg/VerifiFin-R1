<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">VerifiFin-R1金融过程监督与可验证推理流程</title>
  <desc id="desc">展示从金融数据治理、监督微调、过程奖励模型、规则验证、混合奖励、GRPO到Best-of-N推理的完整闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f3"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34265f"/>
      <stop offset="1" stop-color="#234e70"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6846a5"/>
      <stop offset="1" stop-color="#31758d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#243449" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#536f91"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#ce8d32"/>
    </marker>
    <style>
      .hero{font:700 42px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#fff}
      .hero-sub{font:400 19px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#e8e5f5}
      .phase{font:700 14px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;letter-spacing:2px;fill:#7b6c99}
      .title{font:700 23px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#263b53}
      .copy{font:400 16px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#536779}
      .metric{font:700 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#6a4e96}
      .white-title{font:700 28px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#fff}
      .white-copy{font:400 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#edf6f7}
      .pill{font:600 14px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#425d72}
      .small-title{font:700 18px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#314b63}
      .small-copy{font:400 14px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#586f82}
      .footer{font:600 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#4d6074}
    </style>
  </defs>

  <rect width="1600" height="940" rx="28" fill="url(#bg)"/>
  <rect x="40" y="34" width="1520" height="126" rx="24" fill="url(#header)"/>
  <text x="82" y="90" class="hero">VerifiFin-R1 · 金融过程监督与可验证推理</text>
  <text x="84" y="127" class="hero-sub">把“最终答案是否正确”扩展为“推理过程能否定位错误、计算能否确定性验证、奖励能否可靠路由”</text>

  <!-- Phase labels -->
  <text x="68" y="204" class="phase">DATA &amp; SFT</text>
  <text x="606" y="204" class="phase">PROCESS SUPERVISION</text>
  <text x="1150" y="204" class="phase">VERIFIABLE ALIGNMENT</text>

  <!-- Top cards -->
  <g filter="url(#shadow)">
    <rect x="58" y="226" width="298" height="184" rx="22" fill="#fff" stroke="#d8cfea"/>
    <rect x="382" y="226" width="298" height="184" rx="22" fill="#fff" stroke="#d8cfea"/>
    <rect x="706" y="226" width="298" height="184" rx="22" fill="#fff" stroke="#b9d7df"/>
    <rect x="1030" y="226" width="244" height="184" rx="22" fill="#fff" stroke="#b9d7df"/>
    <rect x="1300" y="226" width="244" height="184" rx="22" fill="#fff" stroke="#e8c894"/>
  </g>

  <text x="84" y="263" class="title">① 数据治理</text>
  <text x="84" y="302" class="copy">FinEval与金融考试数据</text>
  <text x="84" y="330" class="copy">模板增强 · 分片隔离 · 去重</text>
  <text x="84" y="358" class="copy">异常答案与截断检测</text>
  <text x="84" y="389" class="metric">22,462条SFT样本</text>

  <text x="408" y="263" class="title">② LoRA SFT</text>
  <text x="408" y="302" class="copy">学习金融问答格式</text>
  <text x="408" y="330" class="copy">建立领域知识冷启动</text>
  <text x="408" y="358" class="copy">输出逐步推理候选</text>
  <text x="408" y="389" class="metric">Qwen2.5-7B-Instruct</text>

  <text x="732" y="263" class="title">③ PRM数据</text>
  <text x="732" y="302" class="copy">生成7,839条推理轨迹</text>
  <text x="732" y="330" class="copy">答案回填 · 逐步骤标注</text>
  <text x="732" y="358" class="copy">清理标签污染与截断</text>
  <text x="732" y="389" class="metric">保留6,683条轨迹</text>

  <text x="1056" y="263" class="title">④ 三分类PRM</text>
  <text x="1056" y="302" class="copy">错误</text>
  <text x="1056" y="330" class="copy">部分正确</text>
  <text x="1056" y="358" class="copy">正确</text>
  <text x="1056" y="389" class="metric">步骤级过程信号</text>

  <text x="1326" y="263" class="title">⑤ AST审计</text>
  <text x="1326" y="302" class="copy">受限算式解析</text>
  <text x="1326" y="330" class="copy">金融公式DSL</text>
  <text x="1326" y="358" class="copy">Rule–Judge冲突</text>
  <text x="1326" y="389" class="metric">594步 / 112例</text>

  <path d="M356 318 H374" stroke="#536f91" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M680 318 H698" stroke="#536f91" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1004 318 H1022" stroke="#536f91" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1274 318 H1292" stroke="#ce8d32" stroke-width="4" marker-end="url(#arrow-gold)"/>

  <!-- Verification router -->
  <rect x="176" y="482" width="1248" height="174" rx="28" fill="url(#router)" filter="url(#shadow)"/>
  <text x="800" y="524" text-anchor="middle" class="white-title">按可验证性组织的 Rule–PRM 混合 Reward</text>
  <text x="800" y="553" text-anchor="middle" class="white-copy">AST判断显式计算是否成立，PRM判断公式选择、上下文逻辑与概念推理，最终答案负责终局门控</text>

  <g>
    <rect x="220" y="581" width="214" height="48" rx="24" fill="#f6f2ff"/><text x="327" y="611" text-anchor="middle" class="pill">答案正确性</text>
    <rect x="458" y="581" width="214" height="48" rx="24" fill="#f6f2ff"/><text x="565" y="611" text-anchor="middle" class="pill">PRM过程质量</text>
    <rect x="696" y="581" width="214" height="48" rx="24" fill="#eef9fa"/><text x="803" y="611" text-anchor="middle" class="pill">AST规则验算</text>
    <rect x="934" y="581" width="214" height="48" rx="24" fill="#fff7e9"/><text x="1041" y="611" text-anchor="middle" class="pill">格式约束</text>
    <rect x="1172" y="581" width="214" height="48" rx="24" fill="#fff0ef"/><text x="1279" y="611" text-anchor="middle" class="pill">投机行为惩罚</text>
  </g>

  <path d="M1152 410 V449 H800 V474" fill="none" stroke="#ce8d32" stroke-width="4" marker-end="url(#arrow-gold)"/>
  <path d="M1422 410 V449 H800" fill="none" stroke="#ce8d32" stroke-width="4"/>

  <!-- Bottom pipeline -->
  <g filter="url(#shadow)">
    <rect x="94" y="724" width="402" height="146" rx="22" fill="#fff" stroke="#c9d6e5"/>
    <rect x="599" y="724" width="402" height="146" rx="22" fill="#fff" stroke="#b9d7df"/>
    <rect x="1104" y="724" width="402" height="146" rx="22" fill="#fff" stroke="#e8c894"/>
  </g>

  <text x="124" y="765" class="title">⑥ GRPO策略优化</text>
  <text x="124" y="803" class="copy">同题多候选 · 组内相对优势</text>
  <text x="124" y="831" class="copy">动态KL约束策略漂移</text>
  <text x="124" y="858" class="metric">过程质量与答案目标共同对齐</text>

  <text x="629" y="765" class="title">⑦ 统一评测</text>
  <text x="629" y="803" class="copy">FinEval最终答案准确率</text>
  <text x="629" y="831" class="copy">过程指标 · 规则覆盖 · 统计检验</text>
  <text x="629" y="858" class="metric">Base / SFT / GRPO同口径比较</text>

  <text x="1134" y="765" class="title">⑧ Best-of-N重排</text>
  <text x="1134" y="803" class="copy">采样多个候选回答</text>
  <text x="1134" y="831" class="copy">Rule + PRM联合选择</text>
  <text x="1134" y="858" class="metric">独立验证奖励模型的排序价值</text>

  <path d="M496 797 H591" stroke="#536f91" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1001 797 H1096" stroke="#ce8d32" stroke-width="4" marker-end="url(#arrow-gold)"/>
  <path d="M800 656 V698 H295 V716" fill="none" stroke="#536f91" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Reproducibility evidence -->
  <g filter="url(#shadow)">
    <rect x="94" y="902" width="438" height="104" rx="18" fill="#f7f3ff" stroke="#d8cfea"/>
    <rect x="581" y="902" width="438" height="104" rx="18" fill="#eef8fa" stroke="#b9d7df"/>
    <rect x="1068" y="902" width="438" height="104" rx="18" fill="#fff7e9" stroke="#e8c894"/>
  </g>
  <text x="120" y="936" class="small-title">数据证据链</text>
  <text x="120" y="965" class="small-copy">question_id / trajectory_id分组切分</text>
  <text x="120" y="990" class="small-copy">训练与FinEval评测隔离 · 数据审计留痕</text>

  <text x="607" y="936" class="small-title">模型证据链</text>
  <text x="607" y="965" class="small-copy">答案Accuracy + PRM Macro-F1 / Recall</text>
  <text x="607" y="990" class="small-copy">规则覆盖率 · 冲突案例 · 概率校准</text>

  <text x="1094" y="936" class="small-title">统计证据链</text>
  <text x="1094" y="965" class="small-copy">多随机种子Mean ± Std</text>
  <text x="1094" y="990" class="small-copy">McNemar检验 · Paired Bootstrap区间</text>

  <text x="800" y="1040" text-anchor="middle" class="footer">SFT → PROCESS DATA → PRM → RULE VERIFICATION → HYBRID REWARD → GRPO → EVALUATION → RERANKING</text>
</svg>
